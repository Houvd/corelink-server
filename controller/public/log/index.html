<html>
    <head>
        <script src="https://corelink.hpc.nyu.edu/client/browser/corelink.browser.lib.js"></script> <!-- this is the library-->
        <meta charset="utf-8"/>
    </head>
    <body>
            <div class='content'>
                <div class='input'>
                    <div class='bottom-left'>
                        <div id="statusIndicators" class='status invisible'>
                            <span>Username: <input id='username' /></span><br />
                            <span>Password: <input id='password' type='password'/></span><br />
                            <span>host: <input id='host' /></span><br />
                            <span>port: <input id='port' value='20012'/></span><br />
                            <button id='start' onclick="run()">Start</button>
                            
                        </div> <br />
                    </div>
                </div>
            </div><br />
            <div id='log'></div>
        </div>
    </body>
</html>
<script>

//store/retrieve settings
if (localStorage.getItem('username') == null) { localStorage.setItem('username', '') }
if (localStorage.getItem('password') == null) { localStorage.setItem('password', '') }
if (localStorage.getItem('host') == null) { localStorage.setItem('host', window.location.hostname) }
if (localStorage.getItem('port') == null) { localStorage.setItem('port', '20012') }
document.getElementById('username').setAttribute('value', localStorage.getItem('username'))
document.getElementById('password').setAttribute('value', localStorage.getItem('password'))
document.getElementById('host').setAttribute('value', localStorage.getItem('host'))
document.getElementById('port').setAttribute('value', localStorage.getItem('port'))

log = document.getElementById('log')

// Setup
const workspace = 'Log'
const protocol = 'ws'
const datatype = ['LogStream']

// helper function to convert buffer to string
function ab2str(buf) {
  return String.fromCharCode.apply(null, new Uint8Array(buf))
}

async function run() {
  config = {}
  config.username = document.getElementById('username').value
  config.password = document.getElementById('password').value
  config.host = document.getElementById('host').value
  config.port = document.getElementById('port').value
  localStorage.setItem('username', document.getElementById('username').value)
  localStorage.setItem('password', document.getElementById('password').value)
  localStorage.setItem('host', document.getElementById('host').value)
  localStorage.setItem('port', document.getElementById('port').value)

  await corelink.connect({ username: config.username, password: config.password }, { ControlIP: config.host, ControlPort: config.port }).catch((e) => console.log(e))
  corelink.on('receiver', (e) => console.log('receiver callback', e))
  corelink.on('sender', (e) => console.log('sender callback', e))
  corelink.on('stale', (e) => console.log('stale callback', e))
  corelink.on('dropped', (e) => console.log('dropped callback', e))

  
  await corelink.createReceiver({
      workspace, protocol, type: datatype, echo: false, alert: false,
    }).catch((err) => { console.log(err) })


  corelink.on('data', (streamid, data, timestamp) => {
    log.insertAdjacentHTML('afterBegin', `${timestamp} ${ab2str(data)}<br />`)
  })
}

</script>
