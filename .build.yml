kaniko-build:
  before_script:
    - ''
  image:
    name: gcr.io/kaniko-project/executor:v1.9.2-debug
    entrypoint: [""]
  variables:
    DOCKERFILE: Dockerfile
    IMAGE_NAME: "corelink-server"
    DIRNAME: "."
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n ${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD} | base64 -w 0)\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context $DIRNAME
      --dockerfile $DIRNAME/${DOCKERFILE}
      --destination $CI_REGISTRY_IMAGE/${IMAGE_NAME}:latest
      --cache=true
      --cache-copy-layers
      --cache-repo ${CI_REGISTRY_IMAGE}/caches